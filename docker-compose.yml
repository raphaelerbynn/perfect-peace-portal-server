# PerfectPeace backend + PostgreSQL (+ pgAdmin) local/Docker stack.
#
# Values are interpolated from the env file passed via `--env-file` (defaults to
# `.env`). For local dev use `.env.docker` (clean, Compose-parseable values); the
# backend service also reads it via env_file. At minimum set: DB_NAME,
# DB_USERNAME, DB_PASSWORD, JWT_KEY, CORS_ORIGINS (see .env.example).
#
#   docker compose --env-file .env.docker up -d --build
#   pgAdmin:  http://localhost:${PGADMIN_PORT:-5051}
#   API:      http://localhost:${SERVER_PORT:-5050}

services:
  db:
    image: postgres:16-alpine
    container_name: pp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs ONCE on first init (empty volume). Your data-move script can run
      # later against the live container. See db/init/01-create-schema.sql.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@perfectpeace.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    depends_on:
      - db

  backend:
    build: .
    container_name: pp-backend
    restart: unless-stopped
    # app secrets/config (JWT_KEY, ARKESEL_KEY, Google creds, CORS_ORIGINS, etc.)
    # Local stack uses .env.docker (clean dev values). For a real deployment,
    # point this at your production env file instead.
    env_file: .env.docker
    environment:
      # these OVERRIDE whatever is in the env_file so the container always points at the
      # compose `db` service on the internal network and listens on 5050.
      DB_HOST: db
      DB_PORT: "5432"
      SERVER_PORT: "5050"
    ports:
      - "${SERVER_PORT:-5050}:5050"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
