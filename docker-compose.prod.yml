# Production stack: API + PostgreSQL + MinIO (files, B17).
#
# Differences from docker-compose.yml (local dev):
#   - no pgAdmin (it ran with no login on a public port);
#   - the database port is NOT published: only the API reaches it, on the
#     internal network (use `docker compose exec db psql ...` for admin);
#   - env from .env.production (never the dev .env.docker values);
#   - the API port binds to 127.0.0.1: put the TLS reverse proxy (nginx /
#     Apache) in front, and set TRUST_PROXY=1 in .env.production.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml exec backend node dist/scripts/migrate.js
#
# Never use docker-compose.test-client.yml for production (tmpfs database,
# seeds on every start).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # B17: private object store for photos, documents and the logo. No port
  # is published: only the API reaches it, on the internal network. Back up
  # the `miniodata` volume TOGETHER with the database (see CUTOVER_RUNBOOK).
  # The official minio/minio image can no longer be pulled (MinIO went
  # source-only); default is Chainguard's build (MINIO_IMAGE to change it).
  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD (16+ chars) in .env.production}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *' 200 '* ]]"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      SERVER_PORT: "5050"
      NODE_ENV: production
      # B17: files in MinIO. The uploads volume below stays mounted for the
      # one-off copy of files saved before (node dist/scripts/uploadsToS3.js)
      # and for STORAGE_DRIVER=local.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-perfect-peace}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${SERVER_PORT:-5050}:5050"
    # B17: the old local-disk folder (STORAGE_DRIVER=local); files now go to MinIO.
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  miniodata:
