# TEST-CLIENT stack - the environment the school tests on.
#
#   * PostgreSQL keeps its data in the Docker volume pp_test_pgdata, so it
#     survives restarts and deploys. scripts/push-copy-to-vps.sh (run on the
#     developer's Mac) replaces it with the local copy of the live data (phone
#     numbers blanked, test passwords set).
#   * Backend: pulled from the registry image built by CI (GitHub Actions), or
#     built locally with `--build`. On every start src/scripts/testClientStart.js
#     applies pending migrations to a live copy, or creates the tables and the
#     single admin on an empty database; then the API starts on port 5040.
#   * To wipe the data: docker compose ... down -v (removes the volume).
#
# Local:   ./scripts/run-test-client.sh            (builds + runs on :5040)
# VPS:     lives in /opt/projects/perfect_peace; the GitHub Action deploys there
#          and Compose reads /opt/projects/perfect_peace/.env.test-client.
#            cd /opt/projects/perfect_peace
#            docker compose -f docker-compose.test-client.yml --env-file .env.test-client pull
#            docker compose -f docker-compose.test-client.yml --env-file .env.test-client up -d

# Distinct project name so this stack never collides with the local dev stack
# (docker-compose.yml) that shares the same directory.
name: pp-test-client

services:
  db:
    image: postgres:16-alpine
    container_name: pp-test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-perfectpeace_test}
      POSTGRES_USER: ${DB_USERNAME:-perfectpeace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-perfectpeace_test_pw}
    volumes:
      # Kept across restarts and deploys (the copy of the live data lives here).
      - pp_test_pgdata:/var/lib/postgresql/data
      # Creates the `dbo` schema when the volume is new (first start only).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-perfectpeace} -d ${DB_NAME:-perfectpeace_test}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    # Registry image produced by .github/workflows/deploy-test-client.yml.
    # `build: .` lets `--build` rebuild it locally from source.
    image: ${BACKEND_IMAGE:-pp-backend:test-client}
    build: .
    container_name: pp-test-backend
    restart: unless-stopped
    env_file: .env.test-client
    environment:
      # Always point at the compose db service and listen on 5040, regardless of
      # what the env file says.
      DB_HOST: db
      DB_PORT: "5432"
      SERVER_PORT: "5040"
    # Boot: migrations for a live copy, or tables + the single admin on an empty
    # database (src/scripts/testClientStart.js), then serve. A failed migration
    # stops here, so the API never runs on a half-migrated copy.
    command: ["sh", "-c", "node dist/scripts/testClientStart.js && node dist/index.js"]
    ports:
      - "${SERVER_PORT:-5040}:5040"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pp_test_pgdata:
